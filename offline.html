	<style>
		.loader {
			position: fixed;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			z-index: 99;
			background: url("images/logo.svg") center no-repeat var(--body-background);
			background-size: 72px 72px;
		}
	</style>

	<!-- Color CSS Define -->
	<style id="switch-theme-color"></style>

	<script>
		(function () {
			const STORAGE_KEY = 'theme';
			const DEFAULT_THEME = 'dark';

			function getLoader() {
				return document.getElementById('loader');
			}

			function getStoredTheme() {
				try {
					const t = localStorage.getItem(STORAGE_KEY);
					return t === 'light' || t === 'dark' ? t : null;
				} catch (e) { return null; }
			}

			function applyTheme(theme) {
				const styles = {
					light: ":root {--body-background:#F4F4F4;--box-background:#EFEFEF;--box-title:#000;--box-text:#555;--symbol-color:#B98A5A;}",
					dark: ":root {--body-background:#1E1E1E;--box-background:#252526;--box-title:#FFF;--box-text:#CCC;--symbol-color:#FCDBB6;}"
				};
				let styleEl = document.getElementById('switch-theme-color');
				if (!styleEl) {
					styleEl = document.createElement('style');
					styleEl.id = 'switch-theme-color';
					document.head.appendChild(styleEl);
				}
				styleEl.textContent = styles[theme];
			}

			const theme = getStoredTheme() || DEFAULT_THEME;
			applyTheme(theme);

			window.addEventListener('load', () => {
				const loader = getLoader();
				if (!loader) return;

				loader.style.transition = 'opacity 0.3s ease';
				loader.style.opacity = '0';
				setTimeout(() => {
					loader.style.display = 'none';
				}, 300);
			});
		})();
	</script>

	<style>
		.fade-out {
			animation: fadeOut 0.3s linear forwards;
		}

		@keyframes fadeOut {
			from {
				opacity: 1;
			}

			to {
				opacity: 0;
			}
		}

		html,
		body {
			background: var(--body-background);
			font-family: "Source Sans Pro", Helvetica, sans-serif;
		}

		* {
			box-sizing: border-box;
		}

		.box {
			width: 350px;
			height: 100%;
			max-height: 500px;
			min-height: 450px;
			background: var(--box-background);
			border-radius: 20px;
			position: absolute;
			left: 50%;
			top: 50%;
			transform: translate(-50%, -50%);
			padding: 30px 50px;
		}

		.box .box-img {
			padding: 15px 25px 25px;
			position: absolute;
			left: 50%;
			top: 30%;
			transform: translate(-50%, -30%);
		}

		.box .box-img .symbol:nth-child(2) {
			position: absolute;
			left: -5px;
			top: 30px;
			height: 18px;
			width: 18px;
			border: 4px solid;
			border-radius: 50%;
			border-color: var(--symbol-color);
			opacity: 0.2;
			animation: shine 4s ease-in-out 1.3s infinite;
		}

		.box .box-img .symbol:nth-child(3) {
			opacity: 0.2;
			animation: shine 3s ease-in-out 0.5s infinite;
		}

		.box .box-img .symbol:nth-child(3):before,
		.box .box-img .symbol:nth-child(3):after {
			content: "";
			width: 12px;
			height: 4px;
			background: var(--symbol-color);
			position: absolute;
			border-radius: 5px;
			top: 5px;
			left: 40px;
		}

		.box .box-img .symbol:nth-child(3):before {
			transform: rotate(90deg);
		}

		.box .box-img .symbol:nth-child(3):after {
			transform: rotate(180deg);
		}

		.box .box-img .symbol:nth-child(4) {
			opacity: 0.2;
			animation: shine 6s ease-in-out 1.6s infinite;
		}

		.box .box-img .symbol:nth-child(4):before,
		.box .box-img .symbol:nth-child(4):after {
			content: "";
			width: 15px;
			height: 4px;
			background: var(--symbol-color);
			position: absolute;
			border-radius: 5px;
			top: 10px;
			right: 30px;
		}

		.box .box-img .symbol:nth-child(4):before {
			transform: rotate(45deg);
		}

		.box .box-img .symbol:nth-child(4):after {
			transform: rotate(-45deg);
		}

		.box .box-img .symbol:nth-child(5) {
			position: absolute;
			right: 5px;
			top: 40px;
			height: 12px;
			width: 12px;
			border: 3px solid;
			border-radius: 50%;
			border-color: var(--symbol-color);
			opacity: 0.2;
			animation: shine 1.7s ease-in-out 7s infinite;
		}

		.box .box-img .symbol:nth-child(6) {
			opacity: 0.2;
			animation: shine 2s ease-in-out 6s infinite;
		}

		.box .box-img .symbol:nth-child(6):before,
		.box .box-img .symbol:nth-child(6):after {
			content: "";
			width: 15px;
			height: 4px;
			background: var(--symbol-color);
			position: absolute;
			border-radius: 5px;
			bottom: 65px;
			right: -5px;
		}

		.box .box-img .symbol:nth-child(6):before {
			transform: rotate(90deg);
		}

		.box .box-img .symbol:nth-child(6):after {
			transform: rotate(180deg);
		}

		.box .box-logo {
			width: 100px;
			height: 100px;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
			animation: upndown 3s ease-in-out infinite;
		}

		.box .box-description {
			position: absolute;
			bottom: 30px;
			left: 50%;
			transform: translateX(-50%);
		}

		.box .box-description .box-description-container {
			color: var(--box-title);
			text-align: center;
			width: 200px;
			font-size: 16px;
			margin: 0 auto;
		}

		.box .box-description .box-description-container .box-description-title {
			font-size: 24px;
			letter-spacing: 0.5px;
		}

		.box .box-description .box-description-container .box-description-text {
			color: var(--box-text);
			line-height: 20px;
			margin-top: 20px;
		}

		.box .box-description .box-button {
			display: block;
			position: relative;
			background: #6a4d3c;
			border: 1px solid transparent;
			border-radius: 50px;
			height: 50px;
			text-align: center;
			text-decoration: none;
			color: #fff;
			line-height: 50px;
			font-size: 18px;
			padding: 0 70px;
			white-space: nowrap;
			margin-top: 25px;
			transition: background 0.5s ease;
			overflow: hidden;
			-webkit-mask-image: -webkit-radial-gradient(white, black);
			mask-image: -webkit-radial-gradient(white, black);
		}

		.box .box-description .box-button:before {
			content: "";
			position: absolute;
			width: 20px;
			height: 100px;
			background: #fff;
			bottom: -25px;
			left: 0;
			border: 2px solid #fff;
			transform: translateX(-50px) rotate(45deg);
			transition: transform 0.5s ease;
		}

		.box .box-description .box-button:hover {
			background: #37271f;
			border-color: #fff;
		}

		.box .box-description .box-button:hover:before {
			transform: translateX(250px) rotate(45deg);
		}

		@keyframes upndown {
			0% {
				transform: translateY(5px);
			}

			50% {
				transform: translateY(15px);
			}

			100% {
				transform: translateY(5px);
			}
		}

		@keyframes smallnbig {
			0% {
				width: 90px;
			}

			50% {
				width: 100px;
			}

			100% {
				width: 90px;
			}
		}

		@keyframes shine {
			0% {
				opacity: 0.2;
			}

			25% {
				opacity: 0.1;
			}

			50% {
				opacity: 0.2;
			}

			100% {
				opacity: 0.2;
			}
		}
	</style>

	<!-- Style CSS -->
